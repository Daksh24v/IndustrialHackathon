[project]
name = "track01-student-kit"
version = "1.0.0"
description = "Track 01 Google Maps for Every Building: starter agent and scorer"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.1.0",
    "fastapi>=0.162.0",
    "matplotlib>=3.11.2",
    "networkx>=3.7",
    "pillow>=13.0.0",
    "scipy>=1.18.1",
    "shapely>=2.2.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["starter_agent", "benchmark", "navcore", "navagent", "server", "voice"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["live: calls the Claude API and costs credits (run with --live)"]
